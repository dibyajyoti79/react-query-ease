name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-query: 5
            react: 19
          - react-query: 4
            react: 18
          # Oldest axios allowed by the dependency range
          - react-query: 5
            react: 19
            axios: 1.3.0
    name: react-query v${{ matrix.react-query }} / react ${{ matrix.react }}${{ matrix.axios && format(' / axios {0}', matrix.axios) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the versions under test
        run: >
          npm install --no-save --legacy-peer-deps
          @tanstack/react-query@${{ matrix.react-query }}
          react@${{ matrix.react }} react-dom@${{ matrix.react }}
          ${{ matrix.axios && format('axios@{0}', matrix.axios) || '' }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
